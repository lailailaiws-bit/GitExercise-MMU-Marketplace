<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    <title>{% block title %}MMU marketplace{% endblock %}</title>
    
    {% block head %}
    {% endblock %}
</head>
<body class="flex flex-col min-h-screen">

    <div class="nav flex flex-wrap md:flex-nowrap items-center justify-between px-4 sm:px-6 py-3 gap-4 bg-white">
        <a href="/home">
            <img src="{{ url_for('static', filename='css/photos/mmu-logo.png')}}" alt="MMU Logo" class="w-36 sm:w-46 md:w-50 lg:w-54 h-auto object-contain my-2">
        </a>

        <div class="w-full md:flex-1 md:w-auto order-3 md:order-2 flex justify-center min-w-0 md:px-6">
            
            <form action="/search" method="GET" class="flex w-full max-w-xl items-center rounded-lg">
                
                <select name="category" class=" text-xs sm:text-sm sm:px-4 py-2 sm:py-2.5 shrink-0 cursor-pointer w-24 sm:w-auto truncate">
                    <option value="all" class="sm:text-sm " >All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="home">Home & Furniture</option>
                    <option value="accessories">Accessories</option>
                </select>
                
                <input type="search" name="q" placeholder="Search items..." aria-label="Search marketplace" required autocomplete="off" class="flex-1 w-full min-w-0 px-3 py-2 text-sm sm:text-base outline-none hover-bg-gray-300 ">
                
                <button type="submit" class="bg-gray-100 hover:bg-gray-200 px-3 sm:px-5 py-2 sm:py-2.5 transition-colors flex items-center justify-center shrink-0 border-l border-gray-300">
                    <img src="{{ url_for('static', filename='css/photos/search.png') }}" alt="Search Icon" class="h-4 sm:h-5 object-contain">
                </button>

            </form>

        </div>

        
       <div class="flex items-center gap-7 sm:gap-9 md,lg:gap-10 flex-shrink-0 order-2 md:order-3">
            <a href="/chat" class="hover:opacity-75 transition-opacity" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='css/photos/chat-icon.png') }}" alt="Chat Icon" class="w-8 h-8 sm:w-9 sm:h-9 md:h-9 md:w-9 lg:w-9 lg:h-9 object-contain">
            </a>
            
            <a href="/profile" class="hover:opacity-75 transition-opacity" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='css/photos/user-icon.png') }}" alt="Profile Icon" class="w-7.5 h-7.5 sm:w-8.5 sm:h-8.5 md:h-8.5 md:w-8.5 lg:w-8.5 lg:h-8.5 object-contain">
            </a>
        </div>
    </div>

    </div> <main class="flex-grow">
        {% block body %}
        {% endblock %}
    </main>

    <!-- {% include 'footer.html' %} -->

</body>
</html>
