<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>{% block title %}MMU marketplace{% endblock %}</title>
    
    {% block head %}
    {% endblock %}
</head>
<body>

    <div class="flex items-center justify-between px-8 py-3 bg-gray-100">
        <a href="/home" class="shrink-0 flex items-center">
            <img src="{{ url_for('static', filename='css/photos/mmu-logo.png')}}" alt="MMU Logo" class="w-44 h-12">
        </a>

        <div class="flex-1 flex justify-center max-w-lg mx-10">
            <form action="/search" method="GET" class="w-full flex items-center bg-white rounded h-10 shadow-sm">
                <select name="category" class="bg-white text-gray-700 px-3 py-2 outline-none cursor-pointer text-sm h-full rounded-l">
                    <option value="all">All Categories</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion</option>
                    <option value="home">Home & Garden</option>
                </select>
                
                <div class="w-px h-5 bg-gray-300"></div>
                
                <input type="search" name="q" placeholder="Search for items, brands, " class="flex-1 px-4 py-2 outline-none text-sm placeholder-gray-400 h-full bg-transparent" required autocomplete="off">
                
                <button type="submit" class="px-4 text-gray-500 hover:text-black h-full flex items-center justify-center rounded-r">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M16.65 16.65A7.5 7.5 0 1116.65 1.5a7.5 7.5 0 010 15.15z"></path>
                    </svg>
                </button>
            </form>
        </div>
        
        <div class="flex items-center gap-6 shrink-0">
            <a href="/chat" class="w-5 h-5 hover:opacity-80 transition-opacity flex items-center justify-center">
                <img src="{{ url_for('static', filename='css/photos/chat-icon.png') }}" alt="Chat Icon" class="w-5 h-5 object-contain">
            </a>

            <a href="/profile" class="w-6 h-6 hover:opacity-80 transition-opacity flex items-center justify-center">
                <img src="{{ url_for('static', filename='css/photos/user-icon.png') }}" alt="Profile Icon" class="w-6 h-6 object-contain">
            </a>
        </div>
    </div>
    {% block body %}
    {% endblock %}

    {% block footer %}
    {% include 'footer.html' %}
    {% endblock %}
</body>
</html>
