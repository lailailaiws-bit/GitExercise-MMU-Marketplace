{% extends "base.html" %}

{% block title %}Cart{% endblock %}

<div class="max-w-4xl mx-auto p-5 font-[sans-serif]">
    <h1 class="text-center font-bold text-[32px] mb-8 text-[#0c2971]">Shopping Cart</h1>

        <div class="text-center py-16 bg-white shadow-sm rounded-[12px] border border-gray-100">
            <div class="text-[60px] mb-4"><img src="{{ url_for('static', filename='css/photos/buy-online.png') }}" alt="Empty Cart" class="w-[100px] h-[100px] mx-auto"></div>

        </div>
</div>
