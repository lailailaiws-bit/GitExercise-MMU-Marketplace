<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/chat.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/output.css') }}">
    <title>{% block title %}Chat with {{ target_username }}{% endblock %}</title>
    {% block head %}{% endblock %}
</head>

<body>
    <div class="nav">
        <a href="/home">
            <img src="{{ url_for('static', filename='css/photos/mmu-logo.png')}}" alt="MMU Logo" class="logo">
        </a>

        <div class=" flex items-center gap-10 mr-1.25">
            <a href="/home" class="w-8 h-8 block" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='css/photos/home.png') }}" alt="Home Icon">
            </a>

            <a href="/profile" class="w-7.5 h-7.5 block" style="text-decoration: none;">
                <img src="{{ url_for('static', filename='css/photos/user-icon.png') }}" alt="Profile Icon">
            </a>

        </div>
    </div>

{% block content %}
    <div class="chat-container flex flex-col max-w-2xl h-[calc(100vh-175px)] mx-auto my-4 overflow-hidden border border-gray-300 rounded-xl shadow-lg bg-white">
        
        <div class="flex justify-between items-center p-3 border-b-5 border-gray-100 bg-white w-full">
            <span class="font-semibold text-gray-700">Chatting with: {{ target_username }}</span>

            <div class="flex gap-1 mr-0.1">
            <a href="{{ url_for('chat_with', target_username=target_username) }}" class="refresh-button">🔄 Refresh</a>
            <a href="{{ url_for('chat_list') }}" class="refresh-button" style="margin-left: 10px;">⬅ Back to List</a>
            </div>
        </div>

        <div class="message-container flex-grow overflow-y-auto p-4 flex flex-col gap-3 bg-white">
            {% for msg in messages %}
                <div class="message {% if msg.sender == current_user.username %} ml-auto receiver-message{% else %} mr-auto sender-message{% endif %}">
                    {{ msg.content }}
                    <span class="time text-[10px] opacity-75 ml-2">{{ msg.time }}</span>
                </div>
            {% else %}
                <div class="text-center text-gray-700 italic">
                    <span>No messages yet? Start chatting with {{ target_username }}!</span>
                </div>
            {% endfor %}
        </div>
        
        <form action="{{ url_for('chat_with', target_username=target_username) }}" method="POST" class="w-full flex gap-2 p-4 border-t bg-gray-50">
            <input type="text" name="content" placeholder="Type..." autofocus required class="flex-grow px-4 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-400">
            <button type="submit" class="bg-black text-white px-5 py-2 rounded-md font-bold">Send</button>
        </form>
    </div>
    {% endblock %}
</body>
</html>
