<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
    <title>Edit Profile</title>
</head>
<body class="bg-gray-100">

    {% include 'header.html' %}

    <div class="max-w-2xl mx-auto mt-10 p-8 bg-white border border-gray-200 rounded-xl shadow-lg">

        <div class="flex justify-between items-center mb-6 border-b-2 border-black pb-4">
            <h1 class="text-2xl font-bold m-0">Edit Account Details</h1>
            <a href="{{url_for('profile')}}" class="text-blue-600 font-semibold hover:underline">← Back</a>
        </div>

        <div class="mb-4">
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div class="bg-green-100 border border-green-400 text-green-700 px-4 py-3 rounded">
                    {% for message in messages %}
                        <p class="text-sm m-0">{{ message }}</p>
                    {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
        </div>

        <form action="/profile_edit" method="POST" enctype="multipart/form-data" class="flex flex-col gap-5">
            
            <div class="flex flex-col gap-1">
                <label class="font-bold text-gray-700">Phone Number</label>
                <input type="tel" name="contact_number" id="contact_number" 
                       placeholder="(e.g 01234567890)" pattern="[0-9]{10,11}" 
                       value="{{ current_user.contact_number if current_user.contact_number else ''}}"
                       class="px-4 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-400">
            </div>

            <div class="flex flex-col gap-1">
                <label class="font-bold text-gray-700">Bio</label>
                <textarea name="bio" id="bio" rows="4" placeholder="Tell us about yourself..."
                          class="px-4 py-2 border rounded-md outline-none focus:ring-2 focus:ring-blue-400 resize-none">{{ current_user.bio if current_user.bio else ''}}</textarea>
            </div>

            <div class="flex flex-col gap-1 p-4 bg-gray-50 border border-dashed border-gray-300 rounded-lg">
                <label class="font-bold text-gray-700">Add a Profile Picture!</label>
                <input type="file" name="profile_pic" id="profile_pic" class="mt-2 text-sm text-gray-600">
            </div>

            <button type="submit" class="w-full bg-blue-500 text-white font-bold py-3 rounded-md hover:bg-blue-600 transition mt-4">
                Save Changes
            </button>
        </form>

    </div>
</body>
</html>
